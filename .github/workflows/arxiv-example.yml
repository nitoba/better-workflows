name: arXiv application dependencies
on:
  push:
    branches: ['example/arxiv-research-app']
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install pinned GitHub consumer and compile dependency
        working-directory: examples/arxiv-research-app
        run: |
          bun install
          node --input-type=module -e "await import('better-workflows'); await import('@llamaindex/liteparse'); console.log('GitHub package imports on Node 24')"
          test -f node_modules/better-workflows/dist/index.d.mts
      - name: Acquire public Mailpit test server
        run: |
          curl --fail --location --retry 2 -o /tmp/mailpit.tar.gz https://github.com/axllent/mailpit/releases/download/v1.27.4/mailpit-linux-amd64.tar.gz
          echo '42d7f693cd01d60a54fe97974b6d701bddecfac1d5db3d7953160fbe009259f9  /tmp/mailpit.tar.gz' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: validated-consumer-tools
          path: |
            /tmp/mailpit.tar.gz
            examples/arxiv-research-app/bun.lock
          retention-days: 1
