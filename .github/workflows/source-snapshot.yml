name: Development snapshot
on:
  push:
    paths: ['.github/workflows/source-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: |
          cp "$(command -v bun)" .ci-bun
          tar --exclude='.git' -czf "$RUNNER_TEMP/workspace.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: ${{ runner.temp }}/workspace.tar.gz
          retention-days: 1
