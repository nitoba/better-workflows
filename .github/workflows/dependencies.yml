name: Example dependency verification
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - name: Pin resolved npm versions
        run: |
          bun -e 'const p=await Bun.file("package.json").json(); for (const section of ["dependencies","devDependencies"]) for (const name of Object.keys(p[section])) if (!p[section][name].startsWith("github:")) p[section][name]=(await Bun.file(`node_modules/${name}/package.json`).json()).version; await Bun.write("package.json",JSON.stringify(p,null,2)+"\n");'
          bun install --ignore-scripts --lockfile-only
      - name: Verify GitHub dependency and native parser imports
        run: |
          bun -e 'import { WorkflowsModule, defineQueue } from "better-workflows"; console.log(defineQueue("probe"), !!WorkflowsModule);'
          node --input-type=module -e 'import {LiteParse} from "@llamaindex/liteparse"; const p=new LiteParse({outputFormat:"markdown",ocrEnabled:false}); console.log("Native parser loaded"); p.close();'
      - name: Export only installed public dependencies and manifests
        run: tar --exclude='*/.git' -czf development-dependencies.tar.gz node_modules package.json bun.lock
      - uses: actions/upload-artifact@v4
        with:
          name: example-development-dependencies
          path: development-dependencies.tar.gz
          retention-days: 1
